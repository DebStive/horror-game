<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty 3D World</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: monospace;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #00ffcc;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 16px;
      border: 1px solid #00ffcc;
      border-radius: 4px;
      font-size: 13px;
      pointer-events: none;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="hud">
    3D ENGINE: EMPTY WORLD<br>
    MOVE: W, A, S, D<br>
    LOOK: Click & Drag Mouse<br>
    POS: <span id="pos">X: 0, Y: 0, Z: 0</span>
  </div>

  <canvas id="worldCanvas"></canvas>

  <script>
    const canvas = document.getElementById('worldCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Camera structure
    let camera = {
      x: 0,
      y: 2,
      z: -10,
      pitch: 0,
      yaw: 0
    };

    let keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let isMouseDown = false;
    let mouseX = 0, mouseY = 0;

    window.addEventListener('mousedown', e => {
      isMouseDown = true;
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => isMouseDown = false);

    window.addEventListener('mousemove', e => {
      if (!isMouseDown) return;
      let dx = e.clientX - mouseX;
      let dy = e.clientY - mouseY;
      mouseX = e.clientX;
      mouseY = e.clientY;

      camera.yaw += dx * 0.003;
      camera.pitch -= dy * 0.003;
      camera.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.pitch));
    });

    // 3D Line Projector Math Engine
    function project(x, y, z) {
      // Translate relative to camera
      let dx = x - camera.x;
      let dy = y - camera.y;
      let dz = z - camera.z;

      // Rotate around Y axis (Yaw)
      let cosY = Math.cos(-camera.yaw), sinY = Math.sin(-camera.yaw);
      let x1 = dx * cosY - dz * sinY;
      let z1 = dx * sinY + dz * cosY;
      let y1 = dy;

      // Rotate around X axis (Pitch)
      let cosP = Math.cos(-camera.pitch), sinP = Math.sin(-camera.pitch);
      let y2 = y1 * cosP - z1 * sinP;
      let z2 = y1 * sinP + z1 * cosP;
      let x2 = x1;

      if (z2 <= 0.1) return null; // Behind camera clipping

      let fov = canvas.width;
      let px = (x2 / z2) * fov + canvas.width / 2;
      let py = (y2 / z2) * fov + canvas.height / 2;

      return { x: px, y: py, scale: 1 / z2 };
    }

    // Generate grid lines for the empty 3D world space
    let gridLines = [];
    for (let i = -50; i <= 50; i += 5) {
      gridLines.push({ x1: i, y1: 0, z1: -50, x2: i, y2: 0, z2: 50 }); // Longitudinal lines
      gridLines.push({ x1: -50, y1: 0, z1: i, x2: 50, y2: 0, z2: i }); // Latitudinal lines
    }

    function update() {
      let speed = 0.15;
      let forwardX = Math.sin(camera.yaw) * speed;
      let forwardZ = Math.cos(camera.yaw) * speed;
      let rightX = Math.sin(camera.yaw + Math.PI / 2) * speed;
      let rightZ = Math.cos(camera.yaw + Math.PI / 2) * speed;

      if (keys['w']) { camera.x += forwardX; camera.z += forwardZ; }
      if (keys['s']) { camera.x -= forwardX; camera.z -= forwardZ; }
      if (keys['a']) { camera.x -= rightX; camera.z -= rightZ; }
      if (keys['d']) { camera.x += rightX; camera.z += rightZ; }

      document.getElementById('pos').innerText = 
        `X: ${camera.x.toFixed(1)}, Y: ${camera.y.toFixed(1)}, Z: ${camera.z.toFixed(1)}`;
    }

    function render() {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw horizon reference grid
      ctx.strokeStyle = '#00ffcc22';
      ctx.lineWidth = 1;

      gridLines.forEach(line => {
        let p1 = project(line.x1, line.y1, line.z1);
        let p2 = project(line.x2, line.y2, line.z2);

        if (p1 && p2) {
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      });

      // Draw origin center marker (3D axes lines)
      let origin = project(0, 0, 0);
      let xAxis = project(5, 0, 0);
      let yAxis = project(0, 5, 0);
      let zAxis = project(0, 0, 5);

      if (origin) {
        if (xAxis) { ctx.strokeStyle = '#ff3333'; ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(xAxis.x, xAxis.y); ctx.stroke(); }
        if (yAxis) { ctx.strokeStyle = '#33ff33'; ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(yAxis.x, yAxis.y); ctx.stroke(); }
        if (zAxis) { ctx.strokeStyle = '#3333ff'; ctx.beginPath(); ctx.moveTo(origin.x, origin.y); ctx.lineTo(zAxis.x, zAxis.y); ctx.stroke(); }
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
